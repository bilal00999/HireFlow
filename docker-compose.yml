# HireFlow — full local/production stack.
#
# Brings up Postgres, Ollama (local AI), the Spring backend, and the built
# frontend behind nginx. Secrets come from a .env file next to this one (copy
# .env.example → .env and fill in). `docker compose up --build` starts it all.
#
# Ports: frontend 5173 → 80, backend 8080, Postgres 5432, Ollama 11434.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hireflow}
      POSTGRES_USER: ${POSTGRES_USER:-hireflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hireflow}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hireflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local, free AI backend. First run must pull the model:
  #   docker compose exec ollama ollama pull mistral
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"

  backend:
    build: ./Backend/demo
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # ollama is only needed when AI_PROVIDER=ollama; uncomment to wait for it:
      # ollama:
      #   condition: service_started
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-hireflow}
      DB_USERNAME: ${POSTGRES_USER:-hireflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hireflow}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@hireflow.local}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      UPLOAD_DIR: /data/uploads
    volumes:
      - upload-data:/data/uploads
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked in at build time — Vite inlines VITE_* into the bundle.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api/v1}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db-data:
  ollama-data:
  upload-data:
